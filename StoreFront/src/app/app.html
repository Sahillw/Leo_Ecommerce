<div
  class="page-wrapper"
  style="
    display: flex;
    background-color: #f8fafc;
    min-height: 100vh;
    font-family:
      system-ui,
      -apple-system,
      sans-serif;
  "
>
  <!-- Sidebar Component -->
  <app-product-category-menu></app-product-category-menu>

  <div
    class="page-container"
    style="flex-grow: 1; display: flex; flex-direction: column"
  >
    <!-- Header with Integrated Search, Login/Logout Status & Cart -->
    <header
      style="
        background-color: #ffffff;
        border-bottom: 1px solid #e2e8f0;
        padding: 16px 35px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
      "
    >
      <!-- Search Bar -->
      <app-search></app-search>

      <!-- User Auth Status (Login/Logout) + Cart Badge -->
      <div class="d-flex align-items-center gap-4">
        <app-header></app-header>
        <app-cart-status></app-cart-status>
      </div>
    </header>

    <!-- Main Dynamic View -->
    <main style="flex-grow: 1; padding: 30px 35px">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
