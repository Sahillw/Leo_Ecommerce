<div
  class="cart-area"
  style="
    background-color: #006699;
    color: white;
    border-radius: 25px;
    padding: 8px 20px;
    display: flex;
    align-items: center;
  "
>
  <a
    routerLink="/cart-details"
    style="
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
    "
  >
    <span style="font-weight: bold; margin-right: 15px; font-size: 18px">{{
      totalPrice | currency: "USD"
    }}</span>
    <span
      style="
        background-color: white;
        color: black;
        border-radius: 50%;
        padding: 4px 12px;
        font-weight: bold;
        font-size: 16px;
      "
      >{{ totalQuantity }}</span
    >
  </a>
</div>
