<div class="d-flex align-items-center">
  <!-- IF LOGGED IN: Show Logout Button and User Email -->
  <ng-container *ngIf="isLoggedIn(); else loggedOutBlock">
    <div class="d-flex align-items-center gap-2">
      <span class="text-secondary fw-semibold small">
        <i class="bi bi-person-circle me-1 text-primary"></i>
        {{ authService.getLoggedUser()?.email }}
      </span>
      <button
        class="btn btn-outline-danger btn-sm px-3 fw-bold rounded-pill"
        (click)="onLogout()"
      >
        Logout
      </button>
    </div>
  </ng-container>

  <!-- IF LOGGED OUT: Show Sign In Button -->
  <ng-template #loggedOutBlock>
    <a
      routerLink="/login"
      class="btn btn-primary btn-sm px-4 fw-bold rounded-pill shadow-sm"
    >
      <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
    </a>
  </ng-template>
</div>
