<aside
  style="
    width: 240px;
    background-color: #0f172a;
    color: #ffffff;
    min-height: 100vh;
    padding: 25px 20px;
    box-shadow: 4px 0 10px rgba(0, 0, 0, 0.05);
    font-family:
      system-ui,
      -apple-system,
      sans-serif;
  "
>
  <!-- Modern Logo Branding -->
  <div
    style="
      margin-bottom: 35px;
      border-bottom: 1px solid #334155;
      padding-bottom: 20px;
    "
  >
    <a routerLink="/" style="text-decoration: none">
      <h2
        style="
          color: #38bdf8;
          font-weight: 800;
          font-size: 22px;
          margin: 0;
          letter-spacing: 1px;
        "
      >
        STORE<span style="color: #ffffff">FRONT</span>
      </h2>
    </a>
  </div>

  <!-- Category Navigation Menu -->
  <div class="menu-sidebar-content">
    <nav class="navbar-sidebar">
      <h4
        style="
          font-size: 11px;
          text-transform: uppercase;
          color: #94a3b8;
          letter-spacing: 1.5px;
          margin-bottom: 15px;
          font-weight: 700;
        "
      >
        Categories
      </h4>
      <ul style="padding-left: 0; list-style: none; margin: 0">
        <li
          *ngFor="let tempCategory of productCategories"
          style="margin-bottom: 8px"
        >
          <a
            [routerLink]="['/category', tempCategory.categoryId]"
            routerLinkActive="active-category"
            style="
              text-decoration: none;
              color: #cbd5e1;
              font-size: 15px;
              font-weight: 500;
              display: block;
              padding: 10px 14px;
              border-radius: 8px;
              transition: all 0.2s ease;
            "
          >
            {{ tempCategory.categoryName }}
          </a>
        </li>
      </ul>
    </nav>
  </div>
</aside>
