<
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Unlock Your Account</h2>
      <p class="auth-subtitle">
        Please enter your temporary password and set a new permanent password
      </p>
    </div>

    <!-- Alert Messages -->
    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>
    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <form (ngSubmit)="onResetPassword()" #resetForm="ngForm">
      <!-- Email (Read-Only) -->
      <div class="form-group mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input
          type="email"
          id="email"
          class="form-control readonly-input"
          [(ngModel)]="resetPwdDto.email"
          name="email"
          readonly
        />
      </div>

      <!-- Temporary / Old Password -->
      <div class="form-group mb-3">
        <label for="oldPwd" class="form-label">Temporary Password</label>
        <input
          type="password"
          id="oldPwd"
          class="form-control"
          placeholder="Enter temporary password from email"
          [(ngModel)]="resetPwdDto.oldPwd"
          name="oldPwd"
          required
        />
      </div>

      <!-- New Password -->
      <div class="form-group mb-3">
        <label for="newPwd" class="form-label">New Password</label>
        <input
          type="password"
          id="newPwd"
          class="form-control"
          placeholder="Enter new permanent password"
          [(ngModel)]="resetPwdDto.newPwd"
          name="newPwd"
          required
        />
      </div>

      <!-- Confirm New Password -->
      <div class="form-group mb-4">
        <label for="confirmPwd" class="form-label">Confirm New Password</label>
        <input
          type="password"
          id="confirmPwd"
          class="form-control"
          placeholder="Re-enter new password"
          [(ngModel)]="resetPwdDto.confirmPwd"
          name="confirmPwd"
          required
        />
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="btn btn-primary btn-submit w-100"
        [disabled]="!resetForm.form.valid"
      >
        Update Password & Unlock
      </button>
    </form>

    <!-- Navigation Link -->
    <div class="auth-footer text-center mt-4">
      <p>
        Remembered your password?
        <a routerLink="/login" class="auth-link">Back to Sign In</a>
      </p>
    </div>
  </div>
</div>
